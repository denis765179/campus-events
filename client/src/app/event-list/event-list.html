<input
  type="search"
  placeholder="Search events…"
  [value]="search()"
  (input)="search.set($any($event.target).value)"
/>

<p class="count">{{ visibleEvents().length }} of {{ events().length }} events</p>


<header class = "division"> Upcoming Events: </header>
<div class="grid">
  @for (event of upcomingEvents(); track event.id) {
    <app-event-card 
    [event]="event"
    [favourite]="favourites().includes(event.id)"
    (favouriteToggle)="toggleFavourite($event)"
    />
  }@empty {
    <p>No upcoming events match your search.</p>
  }
</div>
@if (pastEvents().length > 0){
  <header class = "division"> Past Events: </header>
}
<div class="grid">
  @for (event of pastEvents(); track event.id){
     <app-event-card 
     [event]="event"
     [favourite]="favourites().includes(event.id)"
     (favouriteToggle)="toggleFavourite($event)"
     />
  } 
</div>
